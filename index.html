<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153f2c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Abuja 360"><title>Abuja 360 V1.2</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body><div id="app">
<header class="hud"><div class="brand"><span class="brandmark">360°</span><div><b>Abuja 360</b><small>Build your story in the Capital · V1.2</small></div></div><div class="hudStats"><span id="cash">₦150,000</span><span id="energy">⚡82</span><span id="day">Day 1 · 08:00</span></div></header>
<main class="world"><div class="skyline"><div class="hill h1"></div><div class="hill h2"></div><div class="highrise a"></div><div class="highrise b"></div><div class="highrise c"></div></div><div class="maptitle"><strong>ABUJA</strong><span>YOUR CAPITAL. YOUR STORY.</span></div>
<div class="district d-kubwa"><i>🏘️</i><span>Kubwa</span></div><div class="district d-gwarinpa locked"><i>🏡</i><span>Gwarinpa</span></div><div class="district d-maitama locked"><i>🏛️</i><span>Maitama</span></div>
<div class="road r1"></div><div class="road r2"></div><div class="road r3"></div><div class="roundabout"><i></i></div><div class="lake"><span>JABI LAKE</span></div>
<div class="npc n1">🚶🏾</div><div class="npc n2">🚶🏽‍♀️</div><div class="npc n3">🚴🏾</div><div class="car c1">🚙</div><div class="car c2">🚕</div><div class="car c3">🚌</div>
<button class="place p-work" data-place="work"><span>🏢</span><b>Central Area</b><small id="jobLabel">Jobs</small></button><button class="place p-home" data-place="home"><span>🏠</span><b>My Home</b><small id="homeLabel">Kubwa</small></button><button class="place p-bank" data-place="bank"><span>🏦</span><b>Bank</b><small>Money</small></button><button class="place p-market" data-place="market"><span>🛍️</span><b>Wuse Market</b><small>Shop</small></button><button class="place p-social" data-place="social"><span>🍽️</span><b>Wuse 2</b><small>Social</small></button><button class="place p-park" data-place="park"><span>🌳</span><b>Millennium Park</b><small>Wellness</small></button><button class="place p-jabi" data-place="jabi"><span>🌊</span><b>Jabi</b><small>Leisure</small></button><button class="place p-garage" data-place="garage"><span>🚘</span><b>Auto Hub</b><small>Transport</small></button>
<div class="ticker"><span id="tickerText">☀️ Good morning, Abuja. Build your story.</span></div></main>
<section class="quickbar"><button data-quick="work">💼<span>Work</span></button><button data-quick="eat">🍲<span>Eat</span></button><button data-quick="rest">🛏️<span>Rest</span></button><button data-quick="hustle">💡<span>Hustle</span></button><button data-quick="phone">📱<span>Phone</span></button></section>
<nav class="dock"><button data-tab="map" class="active">🗺️<span>City</span></button><button data-tab="profile">🧑🏾<span>Me</span></button><button data-tab="inventory">🎒<span>Things</span></button><button data-tab="goals">🏆<span>Goals</span></button><button data-tab="feed">📱<span>Feed</span></button></nav>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><section class="sheet"><div class="grab"></div><button id="close" class="close" aria-label="Close">×</button><div id="sheetContent"></div></section></div><div id="toast" class="toast hidden" aria-live="polite"></div>
<div id="creator" class="creator hidden"><form id="creatorForm"><div class="logo">360°</div><h1>Welcome to Abuja</h1><p>Create your character and start with ₦150,000.</p><label>Your name<input id="playerName" maxlength="20" value="Tayo" required></label><div class="avatars"><label><input type="radio" name="avatar" value="🧑🏾" checked><span>🧑🏾</span></label><label><input type="radio" name="avatar" value="👩🏾"><span>👩🏾</span></label><label><input type="radio" name="avatar" value="🧔🏾"><span>🧔🏾</span></label><label><input type="radio" name="avatar" value="👩🏽"><span>👩🏽</span></label></div><label>Starting path<select id="path"><option value="career">Career Builder</option><option value="hustler">Entrepreneur</option><option value="balanced">Balanced Life</option></select></label><button>Enter Abuja →</button></form></div>
</div><script src="game.js"></script></body></html>
