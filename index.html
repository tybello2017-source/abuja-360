<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#163c2b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Abuja 360"><title>Abuja 360</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body><div id="app">
<header class="hud"><div class="brand"><span class="brandmark">360°</span><div><b>Abuja 360</b><small>Build your story in the Capital</small></div></div><div class="hudStats"><span id="cash">₦150,000</span><span id="energy">⚡82</span><span id="day">Day 1 • 08:00</span></div></header>
<main class="world" aria-label="Abuja 360 city">
 <div class="cityscape" aria-hidden="true"><div class="hills"></div><div class="tower t1"></div><div class="tower t2"></div><div class="tower t3"></div><div class="villa v1"></div><div class="villa v2"></div><div class="trees">🌳 🌴 🌳 🌴 🌳 🌳</div></div>
 <div class="maptitle"><strong>ABUJA</strong><span>Federal Capital Territory</span></div>
 <div class="road r1"></div><div class="road r2"></div><div class="road r3"></div><div class="roundabout"><i></i></div><div class="lake"><span>JABI LAKE</span></div>
 <div class="car c1">🚙</div><div class="car c2">🚕</div><div class="car c3">🚗</div>
 <button class="place p-work" data-place="work"><span class="pin">🏢</span><b>Central District</b><small id="jobLabel">Find work</small></button>
 <button class="place p-home" data-place="home"><span class="pin">🏠</span><b>Home</b><small id="homeLabel">Kubwa</small></button>
 <button class="place p-bank" data-place="bank"><span class="pin">🏦</span><b>Bank</b><small>Cash • savings</small></button>
 <button class="place p-market" data-place="market"><span class="pin">🛍️</span><b>Wuse Market</b><small>Food • essentials</small></button>
 <button class="place p-social" data-place="social"><span class="pin">🍽️</span><b>Wuse 2</b><small>Eat • connect</small></button>
 <button class="place p-park" data-place="park"><span class="pin">🌳</span><b>Millennium Park</b><small>Reset • exercise</small></button>
 <button class="place p-jabi" data-place="jabi"><span class="pin">🌊</span><b>Jabi</b><small>Leisure • lifestyle</small></button>
 <button class="place p-garage" data-place="garage"><span class="pin">🚘</span><b>Transport</b><small>Move around ABJ</small></button>
 <div class="ticker"><span id="tickerText">☀️ Good morning, Abuja. Your story starts now.</span></div>
</main>
<section class="quickbar"><button data-quick="work">💼<span>Work</span></button><button data-quick="eat">🍲<span>Eat</span></button><button data-quick="rest">🛏️<span>Rest</span></button><button data-quick="hustle">💡<span>Hustle</span></button></section>
<nav class="dock"><button data-tab="map" class="active">🗺️<span>City</span></button><button data-tab="profile">👤<span>Me</span></button><button data-tab="goals">🏆<span>Goals</span></button><button data-tab="feed">📱<span>Feed</span></button></nav>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><section class="sheet"><div class="grab"></div><button id="close" class="close" aria-label="Close">×</button><div id="sheetContent"></div></section></div><div id="toast" class="toast hidden" aria-live="polite"></div>
</div><script src="game.js"></script></body></html>
